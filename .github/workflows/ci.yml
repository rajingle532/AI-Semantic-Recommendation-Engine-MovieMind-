name: MovieMind CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'test_key' }}
          MONGODB_URI: "mongomock://localhost"
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret' }}

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v3
      
      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.TMDB_API_KEY }}" ]; then echo "WARNING: TMDB_API_KEY is missing!"; fi
          if [ -z "${{ secrets.MONGODB_URI }}" ]; then echo "WARNING: MONGODB_URI is missing! Tests might fail without a database."; fi
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          npm install
          cd backend && pip install -r requirements.txt
          cd ../frontend && npm install
          npx playwright install --with-deps
          
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'test_key' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'super-secret-e2e-key' }}
          FRONTEND_URL: http://127.0.0.1:5173
          CI: true

  deploy:
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Vercel
        run: echo "Auto deployed by Vercel GitHub integration"
